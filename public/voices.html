<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>포롱 목소리 고르기</title>
<style>
  :root { --night:#1b2140; --navy:#2b3466; --cloud:#f4f6ff; --sun:#ffd36b; --ink:#1a1a2e; }
  body { margin:0; background:var(--night); color:var(--cloud); font-family:-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif; padding:20px 16px 48px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .sub { opacity:.75; margin:0 0 18px; line-height:1.5; }
  section { background:var(--navy); border-radius:16px; padding:14px 16px; margin-bottom:16px; }
  h2 { font-size:19px; margin:0 0 4px; }
  .text { opacity:.8; font-size:15px; margin:0 0 12px; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  button { font:inherit; font-size:18px; min-height:56px; border-radius:14px; border:3px solid var(--cloud); background:transparent; color:var(--cloud); display:flex; align-items:center; justify-content:center; gap:8px; }
  button.playing { background:var(--sun); color:var(--ink); border-color:var(--ink); }
  .num { font-weight:800; }
  .empty { background:var(--navy); border-radius:16px; padding:16px; }
</style>
</head>
<body>
<h1>포롱 목소리 고르기</h1>
<p class="sub">아이와 같이 들어 보고, 마음에 드는 목소리의 <b>번호</b>를 채팅으로 알려 주세요. (한국어 1개, 영어 1개)</p>
<div id="list"><div class="empty">샘플을 불러오는 중…</div></div>
<script>
const audio = new Audio()
let current = null
audio.onended = () => current && current.classList.remove('playing')
fetch('voice-samples/list.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(); return r.json() })
  .then(groups => {
    const root = document.getElementById('list')
    root.innerHTML = ''
    groups.forEach(g => {
      const s = document.createElement('section')
      s.innerHTML = `<h2></h2><p class="text"></p><div class="grid"></div>`
      s.querySelector('h2').textContent = g.title
      s.querySelector('.text').textContent = '“' + g.text + '”'
      const grid = s.querySelector('.grid')
      g.items.forEach((it, i) => {
        const b = document.createElement('button')
        b.innerHTML = `<span class="num">${i + 1}</span> <span></span> ▶`
        b.querySelector('span:nth-child(2)').textContent = it.voice
        b.onclick = () => {
          if (current) current.classList.remove('playing')
          current = b
          b.classList.add('playing')
          audio.src = 'voice-samples/' + it.file
          audio.play()
        }
        grid.appendChild(b)
      })
      root.appendChild(s)
    })
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="empty">아직 샘플이 없어요. GitHub 비밀값(GOOGLE_TTS_API_KEY)을 넣고 배포가 끝나면 나타나요.</div>'
  })
</script>
</body>
</html>
